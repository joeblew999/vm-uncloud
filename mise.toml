#:schema https://mise.jdx.dev/schema/mise.json
# vm-uncloud — one-command Uncloud cluster on Hetzner with your own Cloudflare domain.
#
# Flow:  mise run setup   (once)  -> install the uncloud CLI locally
#        mise run up               -> tofu apply (Hetzner box + Cloudflare DNS) + uc machine init
#        mise run deploy           -> uc deploy compose.yaml
#        mise run down             -> tofu destroy (server + DNS records, clean)
#
# Secrets come from fnox (keychain) -> mise tasks. Never hand-edit a .env / .tfvars file.

[tools]
opentofu = "1.12.1"
hcloud   = "1.65.0"
fnox     = "1.25.1"
"github:nushell/nushell[exe=nu]" = "0.113.1"
# Web GUI control plane (gui/server/serve.nu): http-nu serves it, xs is the
# event bus, pitchfork supervises both as daemons. joeblew999 forks add iroh
# relay support (FS sync across clones).
"github:joeblew999/http-nu" = "0.16.0-relay-url.3"
"github:joeblew999/xs"      = "0.12.0-relay-url.3"
pitchfork                   = "latest"

[env]
# Cluster context name `uc` uses.
UNCLOUD_CONTEXT = "hetzner"
TF_IN_AUTOMATION = "1"
# Web GUI control plane.
HTTP_NU_ADDR = "127.0.0.1:8080"
XS_ADDR      = "127.0.0.1:2619"
XS_STORE     = "{{config_root}}/state/xs.store"
# SSH keys are NOT set here — they live once in tofu/terraform.tfvars
# (ssh_key_name + ssh_private_key_file) and flow to the scripts via tofu output.

# ---------------------------------------------------------------------------
# Setup — install the two LOCAL binaries Uncloud needs. Everything server-side
# is pushed over SSH by `uc machine init`, so this is all that runs on your box.
# ---------------------------------------------------------------------------
[tasks.setup]
description = "Install the uncloud CLI (uc) locally"
run = "nu scripts/setup.nu"

# ---------------------------------------------------------------------------
# Lifecycle — every task is wrapped in `fnox exec` so HCLOUD_TOKEN and
# CLOUDFLARE_API_TOKEN are injected from the keychain (never disk); the tofu
# providers and `hcloud` read them straight from the environment.
# ---------------------------------------------------------------------------
[tasks.up]
description = "Provision Hetzner VPS + Cloudflare DNS, then init the Uncloud cluster"
run = "fnox exec -- nu scripts/up.nu"

[tasks.deploy]
description = "Deploy services from compose.yaml to the cluster"
run = "fnox exec -- nu scripts/deploy.nu"

[tasks.push]
description = "Ship local Docker images to the cluster (uc build --push, or: mise run push <image>)"
run = "nu scripts/push.nu"

[tasks.down]
description = "Destroy the server and remove its Cloudflare DNS records"
run = "fnox exec -- nu scripts/down.nu"

[tasks.status]
description = "Show machines, services, and the resolved cluster domain"
run = "fnox exec -- nu scripts/status.nu"

[tasks.ci]
description = "Repo checks: tofu fmt + validate + nushell parse (also run by CI)"
run = "nu scripts/ci.nu"

[tasks."caddy:external"]
description = "Front non-container services (bare metal/BMC/home hub) via managed Caddy"
run = "fnox exec -- nu scripts/caddy-external.nu"

# Deploy a ready-made recipe from psviderski/uncloud-recipes, e.g.
#   mise run recipe wordpress-mariadb
# Clones the recipes into .src/ (gitignored) on first use. See examples/.
[tasks.recipe]
description = "Deploy a named recipe from uncloud-recipes (e.g. wordpress-mariadb)"
run = "fnox exec -- nu scripts/recipe.nu"

# ---------------------------------------------------------------------------
# Hidden tasks — used by tooling/verification, not part of the day-to-day flow.
# Still runnable by name (mise run tofu:plan), just not listed in `mise tasks`.
# ---------------------------------------------------------------------------
[tasks."tofu:plan"]
description = "Preview infrastructure changes without applying"
hide = true
run = "fnox exec -- tofu -chdir=tofu plan"

[tasks."recipes:sync"]
description = "Shallow-clone/update uncloud-recipes into .src/"
hide = true
run = "nu scripts/recipes-sync.nu"

[tasks."state:remote"]
description = "Move tofu state into Cloudflare R2 (durable + lockable; one-time)"
run = "fnox exec -- nu scripts/state-remote.nu"

[tasks.smoke]
description = "CI check: tofu apply+destroy a throwaway box (infra only, no DNS, no uncloud)"
hide = true
run = "fnox exec -- nu scripts/smoke.nu"

# ---------------------------------------------------------------------------
# Costs — queryable Hetzner/Vultr/R2 price model (state/costs.jsonl). Use it
# to pick a node class per workload (cpx22 cluster vs cpx42 Windows vs KVM BM).
# ---------------------------------------------------------------------------
[tasks."costs:show"]
description = "Print state/costs.jsonl as a table — provider/SKU pricing to size nodes per workload."
shell = "nu --commands"
run = "open state/costs.jsonl | lines | each {|l| $l | from json } | table -e"

# ---------------------------------------------------------------------------
# win — Windows desktop node (dockur/windows on a dedicated win-batch node, its
# own tofu workspace + uncloud context). Cost discipline: snapshot then down.
#   mise run win:up → win:deploy → win:rdp:wait → win:rdp → ... → win:down
# Needs tofu/win-batch.tfvars (cp from win-batch.tfvars.example).
# ---------------------------------------------------------------------------
[tasks."win:up"]
description = "Provision the dedicated cpx42 Windows node (win-batch context)."
run = "fnox exec -- nu scripts/up.nu --context win-batch"

[tasks."win:deploy"]
description = "Deploy the windows recipe (dockur/windows) onto the win-batch node."
run = "fnox exec -- nu scripts/recipe.nu windows --context win-batch"

[tasks."win:ip"]
description = "Public IPv4 of the Windows node."
run = "nu connect/ip.nu"

[tasks."win:status"]
description = "Describe the Windows node (state, type, IP)."
run = "fnox exec -- hcloud server describe win-batch-1"

[tasks."win:snapshot"]
description = "Snapshot the Windows node — preserve state before teardown."
shell = "nu --commands"
run = "fnox exec -- hcloud server create-image --type snapshot --description $\"win-batch-(date now | format date '%Y%m%d-%H%M%S')\" win-batch-1"

[tasks."win:down"]
description = "Snapshot THEN destroy the Windows node (stops billing; restore with win:up)."
depends = ["win:snapshot"]
run = "fnox exec -- nu scripts/down.nu --context win-batch"

[tasks."win:rdp:install"]
description = "Install/verify an RDP client for this OS (idempotent)."
run = "nu connect/rdp-install.nu"

[tasks."win:rdp:wait"]
description = "Block until the Windows node accepts RDP on :3389 (desktop notification when ready)."
run = "fnox exec -- nu connect/rdp-wait.nu"

[tasks."win:rdp"]
description = "Open RDP to the Windows node (user Docker / pass admin). Installs the client first."
depends = ["win:rdp:install"]
run = "fnox exec -- nu connect/rdp-open.nu"

[tasks."win:viewer"]
description = "Open dockur's noVNC viewer (:8006) over an SSH tunnel — Windows install progress / desktop."
run = "fnox exec -- nu connect/viewer-open.nu"

# ---------------------------------------------------------------------------
# gui — browser status board (nodes, services, snapshots, costs, deploy ledger),
# served by http-nu + Datastar, supervised by pitchfork alongside the xs event
# bus. Named gui:*/xs:* so they don't collide with the cluster's up/down.
#   mise run gui:up   → http://127.0.0.1:8080   ;   mise run gui:down
# ---------------------------------------------------------------------------
[tasks."gui:up"]
description = "Start the web GUI + xs event bus (pitchfork daemons). → http://127.0.0.1:8080"
run = "pitchfork start xs gui"
dir = "{{config_root}}"

[tasks."gui:down"]
description = "Stop the web GUI + xs daemons."
run = "pitchfork stop xs gui"
dir = "{{config_root}}"

[tasks."gui:serve"]
description = "Run the GUI in the foreground (interactive; --watch hot-reloads serve.nu). For background use gui:up."
run = "fnox exec -- http-nu --datastar --watch $HTTP_NU_ADDR gui/server/serve.nu"

[tasks."xs:serve"]
description = "Run the xs event store in the foreground. For background use gui:up."
run = "xs serve $XS_STORE --expose $XS_ADDR"
dir = "{{config_root}}"

[tasks."gui:logs"]
description = "Tail the GUI daemon log (--follow)."
run = "pitchfork logs gui --follow"

[tasks."jobs"]
description = "Show what pitchfork is supervising (gui, xs)."
run = "pitchfork list"

# ---------------------------------------------------------------------------
# Secrets — one-time keychain population. Run these once per machine.
#   mise run secrets:set   then paste each token.
# ---------------------------------------------------------------------------
[tasks."secrets:set"]
description = "Seed HCLOUD_TOKEN + CLOUDFLARE_API_TOKEN in the keychain (skip if already set)"
run = """
echo "These are shared keychain items (service: fnox). If 'fnox get' shows a value, you're done."
fnox get HCLOUD_TOKEN >/dev/null 2>&1         && echo "HCLOUD_TOKEN: already set"         || fnox set -p keychain HCLOUD_TOKEN
fnox get CLOUDFLARE_API_TOKEN >/dev/null 2>&1 && echo "CLOUDFLARE_API_TOKEN: already set" || fnox set -p keychain CLOUDFLARE_API_TOKEN
"""
