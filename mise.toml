#:schema https://mise.jdx.dev/schema/mise.json
# vm-uncloud — one-command Uncloud cluster on Hetzner with your own Cloudflare domain.
#
# Flow:  mise run cluster:setup   (once)  -> install the uncloud CLI locally
#        mise run cluster:up               -> tofu apply (Hetzner box + Cloudflare DNS) + uncloud machine init
#        mise run cluster:deploy           -> uncloud deploy compose.yaml
#        mise run cluster:down             -> tofu destroy (server + DNS records, clean)
#
# Secrets come from fnox (keychain) -> mise tasks. Never hand-edit a .env / .tfvars file.

[task_config]
# Shared mise task lib. cliff:* = changelog/release intel — track uncloud's
# unreleased delta with `mise run cliff:repo -- psviderski/uncloud`.
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/cliff.toml?ref=v0.33.0",
]

[tools]
opentofu = "1.12.3"
hcloud   = "1.65.0"
# uncloud — the CLI (UPSTREAM psviderski/uncloud; we dropped our fork). A REAL mise
# tool: `mise install` provides it, no out-of-band binary in /usr/local/bin. As of
# v0.20.0 the CLI binary is `uc` (was `uncloud`); scripts call `^uc`. The daemon
# binary `uncloudd` is unchanged; `uc machine init/add` installs it over SSH. v0.20
# moved Corrosion to a managed Docker container (auto-migrates). Bump deliberately:
# the gRPC proxy format changed, so CLI + all cluster machines must be the same
# major — upgrade while no cluster is running, or re-init.
"github:psviderski/uncloud" = "0.20.0"
# fnox — the secret client every task uses (`fnox exec`/`fnox get` inject keychain
# secrets). Pinned so `mise install` provides it automatically; same version the
# orangevault repo uses. Without this it had to be installed out-of-band.
"github:jdx/fnox" = "1.27.1"
# orangevault-cli — auto-provisions the dedicated dev/CI OrangeVault account
# (register + mint API key) for dev:secrets:set. Pure-Rust, multi-OS release.
"github:joeblew999/orangevault" = "0.1.1"
# nushell — pinned so `mise install` provides the `nu` every script + the CI parse
# checks run on (gui/serve.nu, connect/*, scripts/*, recipe prepare.nu).
"aqua:nushell/nushell" = "0.113.1"
# Web GUI control plane (gui/server/serve.nu): http-nu serves it, xs is the
# event bus, pitchfork supervises both as daemons. joeblew999 forks add iroh
# relay support (FS sync across clones) — now folded into the clean v0.17.0
# releases (the old `-relay-url.N` prerelease tags are deprecated).
"github:joeblew999/http-nu" = "0.17.0"
"github:joeblew999/xs"      = "0.17.0"
# yoke — one LLM agent turn as a unix pipe; powers `ai:ask`. Same ecosystem.
"github:cablehead/yoke"     = "0.4.1"
# aws-cli — ONLY for the win-kvm R2 snapshot transit (Vultr has no hot-snapshot).
aws                         = "2.35.11"
# vultr-cli — provisions the win-kvm Vultr Bare Metal node (vultr-{up,init,down,
# snapshot}.nu call it via `fnox exec`). Reads VULTR_API_KEY natively.
"ubi:vultr/vultr-cli"       = "latest"

[env]
# Cluster context name `uncloud` uses.
UNCLOUD_CONTEXT = "hetzner"
TF_IN_AUTOMATION = "1"
# Web GUI control plane.
HTTP_NU_ADDR = "127.0.0.1:8080"
XS_ADDR      = "127.0.0.1:2619"
XS_STORE     = "{{config_root}}/state/xs.store"

# win-kvm (Vultr Bare Metal). VULTR_API_KEY lives in the keychain (fnox); the
# rest are non-secret selections — override in mise.local.toml. Enumerate with
# `vultr-cli regions list` / `plans list` (BM, >=6c) / `os list` / `ssh-key list`.
VULTR_LABEL      = "win-kvm"
VULTR_REGION     = ""
VULTR_PLAN       = ""
VULTR_OS_ID      = "1743"   # Ubuntu 24.04 x64
VULTR_SSH_KEY_ID = ""

# R2 snapshot-transit (win-kvm state preservation). Set in mise.local.toml after
# `mise run r2:bootstrap`; R2_ACCESS_KEY_ID/SECRET live in the keychain.
R2_ENDPOINT = ""
R2_BUCKET   = ""

# OrangeVault (dev-container secrets). The LIVE vault URL — public, non-secret, so
# it's defaulted here for zero-config; override in mise.local.toml for your own
# instance. The dev/CI ACCOUNT creds (email / API key / master password) are secret
# and live in the keychain — set them with `mise run dev:secrets:set`.
ORANGEVAULT_DEV_DOMAIN = "https://orangevault.gedw99.workers.dev"
# SSH keys are NOT set here — they live once in tofu/terraform.tfvars
# (ssh_key_name + ssh_private_key_file) and flow to the scripts via tofu output.

# ---------------------------------------------------------------------------
# Setup — install the two LOCAL binaries Uncloud needs. Everything server-side
# is pushed over SSH by `uncloud machine init`, so this is all that runs on your box.
# ---------------------------------------------------------------------------
[tasks."cluster:setup"]
description = "Ensure tools are installed (mise) + print next steps"
run = "nu scripts/cluster-setup.nu"

# ---------------------------------------------------------------------------
# Lifecycle — every task is wrapped in `fnox exec` so HCLOUD_TOKEN and
# CLOUDFLARE_API_TOKEN are injected from the keychain (never disk); the tofu
# providers and `hcloud` read them straight from the environment.
# ---------------------------------------------------------------------------
[tasks."cluster:up"]
description = "Provision Hetzner VPS + Cloudflare DNS, then init the Uncloud cluster"
run = "fnox exec --if-missing ignore -- nu scripts/cluster-up.nu"

[tasks."cluster:deploy"]
description = "Deploy services from compose.yaml to the cluster"
run = "fnox exec --if-missing ignore -- nu scripts/cluster-deploy.nu"

[tasks."cluster:push"]
description = "Ship local Docker images to the cluster (uncloud build --push, or: mise run cluster:push <image>)"
run = "nu scripts/cluster-push.nu"

[tasks."cluster:down"]
description = "Destroy the server and remove its Cloudflare DNS records"
run = "fnox exec --if-missing ignore -- nu scripts/cluster-down.nu"

[tasks."cluster:status"]
description = "Show machines, services, and the resolved cluster domain"
run = "fnox exec --if-missing ignore -- nu scripts/cluster-status.nu"

[tasks.ci]
description = "Repo checks: tofu fmt + validate + nushell parse (also run by CI)"
run = "nu scripts/ci.nu"

[tasks."caddy:external"]
description = "Front non-container services (bare metal/BMC/home hub) via managed Caddy"
run = "fnox exec --if-missing ignore -- nu scripts/caddy-external.nu"

# Deploy a ready-made recipe from psviderski/uncloud-recipes, e.g.
#   mise run recipe:deploy wordpress-mariadb
# Clones the recipes into .src/ (gitignored) on first use. See examples/.
[tasks."recipe:deploy"]
description = "Deploy a named recipe from uncloud-recipes (e.g. wordpress-mariadb)"
run = "fnox exec --if-missing ignore -- nu scripts/recipe-deploy.nu"

# Run the SAME recipe locally via plain docker compose (DRY with `recipe` above —
# shared compose.yaml + prepare.nu; local deltas in an optional compose.local.yaml).
# Needs a local Docker daemon. No fnox: local uses throwaway secrets.
#   mise run recipe:local rauthy          # up   → http://localhost:<port>
#   mise run recipe:local rauthy --down   # reset
[tasks."recipe:local"]
description = "Run a recipe locally via docker compose (e.g. rauthy) — DRY with the remote `recipe` task"
run = "nu scripts/recipe-local.nu"

# moq local demo — relay (docker) + web UI (vite) + optional Big Buck Bunny pub,
# all orchestrated in recipes/moq/demo.nu. The moq web UI isn't a published image
# (only the relay/CLIs are), so it runs under bun; the relay/publisher are the
# moqdev/* containers. Usage: mise run moq:demo -- <up|down|pub|status>.
[tasks."moq:demo"]
description = "Local moq demo: relay (docker) + web UI on :5173. Usage: mise run moq:demo -- <up|down|pub|status>"
run = "nu recipes/moq/demo.nu"

# ---------------------------------------------------------------------------
# Hidden tasks — used by tooling/verification, not part of the day-to-day flow.
# Still runnable by name (mise run tofu:plan), just not listed in `mise tasks`.
# ---------------------------------------------------------------------------
[tasks."tofu:plan"]
description = "Preview infrastructure changes without applying"
hide = true
run = "fnox exec --if-missing ignore -- tofu -chdir=tofu plan"

[tasks."recipe:sync"]
description = "Shallow-clone/update uncloud-recipes into .src/"
hide = true
run = "nu scripts/recipe-sync.nu"

# ---------------------------------------------------------------------------
# Turso / libSQL — self-hosted SQLite (D1 replacement) with R2-backed DR.
# The `turso` recipe runs sqld with bottomless backup -> R2. These tasks
# REHEARSE recovery (read-only on R2) so DR is a runnable drill, not a hope.
# ---------------------------------------------------------------------------
[tasks."turso:deploy"]
description = "Deploy the turso/libSQL recipe onto the cluster (bottomless backup -> R2)"
run = "mise run recipe:deploy turso"

[tasks."turso:token"]
description = "Print the libSQL client auth token (generates+persists the JWT keypair on first run). Give this to a consuming project."
run = "nu recipes/turso/auth.nu token"

[tasks."turso:db:create"]
description = "Create a new SQLite database (namespace) on the turso server. Usage: mise run turso:db:create -- <name>"
run = "fnox exec -- nu recipes/turso/db.nu create"

[tasks."turso:db:delete"]
description = "Delete a SQLite database (namespace). DESTRUCTIVE. Usage: mise run turso:db:delete -- <name>"
run = "fnox exec -- nu recipes/turso/db.nu delete"

[tasks."turso:db:list"]
description = "List the SQLite databases (from their R2 backups) and generation counts"
run = "fnox exec -- nu recipes/turso/dr.nu list"

[tasks."turso:dr:list"]
description = "DR: list every database + its backup generations in R2"
run = "fnox exec -- nu recipes/turso/dr.nu list"

[tasks."turso:dr:verify"]
description = "DR WEEKLY DRILL: restore the latest R2 backup + integrity-check it (read-only, exits non-zero on failure)"
run = "fnox exec -- nu recipes/turso/dr.nu verify"

[tasks."turso:dr:restore"]
description = "DR: restore a Turso backup from R2 to a local .db file (recovery / point-in-time via --utc-time)"
run = "fnox exec -- nu recipes/turso/dr.nu restore"

[tasks."state:remote"]
description = "Move tofu state into Cloudflare R2 (durable + lockable; one-time)"
run = "fnox exec --if-missing ignore -- nu scripts/state-remote.nu"

[tasks."cluster:smoke"]
description = "CI check: tofu apply+destroy a throwaway box (infra only, no DNS, no uncloud)"
hide = true
run = "fnox exec --if-missing ignore -- nu scripts/cluster-smoke.nu"

# ---------------------------------------------------------------------------
# Prices — queryable price model (rate cards), split by class into three files:
#   prices-hetzner-cloud.jsonl      Hetzner Cloud VPS           — live, prices:refresh:hetzner-cloud
#   prices-hetzner-dedicated.jsonl  Hetzner dedicated, new-order — live, prices:refresh:hetzner-dedicated
#   prices-hetzner-auction.jsonl    Hetzner auction floor (cheap used) — live, prices:refresh:hetzner-auction
#   prices-static.jsonl             static: storage, egress, software, vultr/equinix/local
# (The incurred-cost ledger is state/log.jsonl, separate.) Use these to pick a
# node class per workload (cpx22 cluster vs cpx42 Windows vs dedicated KVM BM).
# ---------------------------------------------------------------------------
[tasks."prices:show"]
description = "Print the price model (all state/prices-*.jsonl) as a table — provider/SKU pricing to size nodes per workload."
shell = "nu --commands"
run = "glob state/prices-*.jsonl | each {|f| open --raw $f | lines | where {|l| ($l | str trim) != \"\" } | each {|l| $l | from json } } | flatten | table -e"

[tasks."prices:refresh:hetzner-cloud"]
description = "Regenerate state/prices-hetzner-cloud.jsonl (Hetzner Cloud VPS) from the live hcloud API. Dry-run by default; pass --write to persist."
run = "fnox exec --if-missing ignore -- nu scripts/prices-refresh-hetzner-cloud.nu"

[tasks."prices:refresh:hetzner-dedicated"]
description = "Regenerate state/prices-hetzner-dedicated.jsonl (Hetzner dedicated, new-order) from the live Robot Webservice. Needs HETZNER_ROBOT_USER/PASSWORD. Dry-run by default; --write to persist."
run = "fnox exec --if-missing ignore -- nu scripts/prices-refresh-hetzner-dedicated.nu"

[tasks."prices:refresh:hetzner-auction"]
description = "Regenerate state/prices-hetzner-auction.jsonl (Hetzner server-auction floor — cheapest used dedicated per RAM tier). Needs HETZNER_ROBOT_USER/PASSWORD. Dry-run by default; --write to persist."
run = "fnox exec --if-missing ignore -- nu scripts/prices-refresh-hetzner-auction.nu"

# Convenience: refresh + PERSIST every live price file in one shot. The Robot
# feeds (dedicated/auction) skip cleanly if HETZNER_ROBOT_USER/PASSWORD aren't set.
[tasks."prices:refresh:all"]
description = "Regenerate + persist ALL live price files (cloud + dedicated + auction). Robot feeds skip if no creds."
shell = "nu -c"
run = '''
^fnox exec --if-missing ignore -- nu scripts/prices-refresh-hetzner-cloud.nu --write
for s in ["prices-refresh-hetzner-dedicated.nu" "prices-refresh-hetzner-auction.nu"] {
  do { ^fnox exec --if-missing ignore -- nu ("scripts" | path join $s) --write } | complete | ignore
}
'''

# ---------------------------------------------------------------------------
# win — Windows desktop node (dockur/windows on a dedicated win-batch node, its
# own tofu workspace + uncloud context). Cost discipline: snapshot then down.
#   mise run win:up → win:deploy → win:rdp:wait → win:rdp → ... → win:down
# Needs tofu/win-batch.tfvars (cp from win-batch.tfvars.example).
# ---------------------------------------------------------------------------
[tasks."win:up"]
description = "Provision the dedicated cpx42 Windows node (win-batch context)."
run = "fnox exec --if-missing ignore -- nu scripts/cluster-up.nu --context win-batch"

[tasks."win:deploy"]
description = "Deploy the windows recipe (dockur/windows) onto the win-batch node."
run = "fnox exec --if-missing ignore -- nu scripts/recipe-deploy.nu windows --context win-batch"

[tasks."win:ip"]
description = "Public IPv4 of the Windows node."
run = "nu connect/ip.nu"

[tasks."win:status"]
description = "Describe the Windows node (state, type, IP)."
run = "fnox exec --if-missing ignore -- hcloud server describe win-batch-1"

[tasks."win:snapshot"]
description = "Snapshot the Windows node — preserve state before teardown."
shell = "nu --commands"
run = "fnox exec --if-missing ignore -- hcloud server create-image --type snapshot --description $\"win-batch-(date now | format date '%Y%m%d-%H%M%S')\" win-batch-1"

[tasks."win:down"]
description = "Snapshot THEN destroy the Windows node (stops billing; restore with win:up)."
depends = ["win:snapshot"]
run = "fnox exec --if-missing ignore -- nu scripts/cluster-down.nu --context win-batch"

[tasks."win:rdp:install"]
description = "Install/verify an RDP client for this OS (idempotent)."
run = "nu connect/rdp-install.nu"

[tasks."win:rdp:wait"]
description = "Block until the Windows node accepts RDP on :3389 (desktop notification when ready)."
run = "fnox exec --if-missing ignore -- nu connect/rdp-wait.nu"

[tasks."win:rdp"]
description = "Open RDP to the Windows node (user Docker / pass admin). Installs the client first."
depends = ["win:rdp:install"]
run = "fnox exec --if-missing ignore -- nu connect/rdp-open.nu"

[tasks."win:viewer"]
description = "Open dockur's noVNC viewer (:8006) over an SSH tunnel — Windows install progress / desktop."
run = "fnox exec --if-missing ignore -- nu connect/viewer-open.nu"

# ---------------------------------------------------------------------------
# win-kvm — KVM-fast Windows on bare metal (Vultr BM). Hetzner Cloud has no
# /dev/kvm, so interactive Windows that's too slow on win-batch (TCG) goes here.
# Needs VULTR_API_KEY (keychain) + VULTR_REGION/PLAN/OS_ID/SSH_KEY_ID (mise.local).
#   win-kvm:up → win-kvm:ip → win-kvm:init → win-kvm:deploy → win:rdp → win-kvm:down
# (rdp/viewer reuse the win: tasks with WIN_PROVIDER=vultr — see below.)
# ---------------------------------------------------------------------------
[tasks."win-kvm:onboard"]
description = "HIL onboarding — check & guide getting every token/config the win-kvm Vultr path needs. Run this FIRST."
run = "nu scripts/vultr-onboard.nu"

[tasks."win-kvm:up"]
description = "Provision a Vultr Bare Metal KVM node (uncloud-bootstrapped). Run `win-kvm:onboard` first."
run = "fnox exec --if-missing ignore -- nu scripts/vultr-up.nu"

[tasks."win-kvm:ip"]
description = "Public IPv4 of the win-kvm Vultr node (once booted)."
env = { WIN_PROVIDER = "vultr" }
run = "nu connect/ip.nu"

[tasks."win-kvm:init"]
description = "Join the booted Vultr BM to the win-kvm uncloud context (uncloud machine init)."
run = "fnox exec --if-missing ignore -- nu scripts/vultr-init.nu"

[tasks."win-kvm:deploy"]
description = "Deploy the KVM windows recipe (dockur + /dev/kvm) onto the win-kvm node."
run = "fnox exec --if-missing ignore -- nu scripts/recipe-deploy.nu windows-kvm --context win-kvm"

[tasks."win-kvm:rdp"]
description = "RDP into the win-kvm Vultr node (Docker/admin)."
env = { WIN_PROVIDER = "vultr" }
depends = ["win:rdp:install"]
run = "fnox exec --if-missing ignore -- nu connect/rdp-open.nu"

[tasks."win-kvm:viewer"]
description = "noVNC viewer for the win-kvm node over an SSH tunnel."
env = { WIN_PROVIDER = "vultr" }
run = "fnox exec --if-missing ignore -- nu connect/viewer-open.nu"

[tasks."win-kvm:snapshot"]
description = "Snapshot the win-kvm Windows disk via R2 transit (UNVERIFIED port — needs R2 + Vultr + live run)."
run = "fnox exec --if-missing ignore -- nu scripts/vultr-snapshot.nu"

[tasks."win-kvm:down"]
description = "Destroy the win-kvm Vultr node. Run win-kvm:snapshot FIRST to preserve state (not automatic)."
run = "fnox exec --if-missing ignore -- nu scripts/vultr-down.nu"

# ---------------------------------------------------------------------------
# dev — remote DEV nodes (dev-linux / dev-windows recipes). A developer keeps
# their repo on their Mac and compiles/tests on a real remote box that matches
# the deploy target. Same idiom as win:* — a teardownable node class in its own
# context (tofu/dev.tfvars, tofu/dev-win.tfvars). Toolchains come from each
# PROJECT's mise.toml; the project drives the loop via the shared tasks/dev.toml.
# See docs/DEVCONTAINERS.md.
#   mise run dev:up → dev:deploy → dev:ssh:wait → dev:code → ... → dev:down
# ---------------------------------------------------------------------------
[tasks."dev:up"]
description = "Provision the dedicated Linux dev node (dev context)."
run = "fnox exec --if-missing ignore -- nu scripts/cluster-up.nu --context dev"

[tasks."dev:deploy"]
description = "Build + deploy the dev-linux recipe (mise + sshd) onto the dev node."
run = "fnox exec --if-missing ignore -- nu scripts/recipe-deploy.nu dev-linux --context dev"

[tasks."dev:ip"]
description = "Public IPv4 of the Linux dev node."
run = "fnox exec --if-missing ignore -- hcloud server ip dev-1"

[tasks."dev:ssh:wait"]
description = "Block until the dev container accepts SSH on its published port."
run = "nu connect/ssh-wait.nu"

[tasks."dev:ssh"]
description = "Open an interactive SSH session into the dev container (terminal entry)."
run = "nu connect/ssh-open.nu"

[tasks."dev:code"]
description = "Open VS Code Remote-SSH into the dev container at /workspace."
run = "nu connect/code-open.nu"

[tasks."dev:status"]
description = "Describe the Linux dev node (state, type, IP)."
run = "fnox exec --if-missing ignore -- hcloud server describe dev-1"

[tasks."dev:down"]
# Headless --yes (unlike the cluster/win teardown which prompts): a dev node is
# reproducible — its only state (the synced repo) lives on the dev's Mac — so
# operations / CI / Claude Code can tear it down non-interactively. Re-create
# with dev:up + dev:deploy.
description = "Destroy the Linux dev node (auto-confirmed; reproducible — re-sync after dev:up)."
run = "fnox exec --if-missing ignore -- nu scripts/cluster-down.nu --context dev --yes"

# dev-windows — a Windows dev desktop node (windows=true AND dev=true). RDP is
# the primary entry; SSH/Remote-SSH into the guest is EXPERIMENTAL. Override
# DEV_NODE=dev-win-1 / DEV_USER=Docker for the connect helpers against it.
[tasks."dev:win:up"]
description = "Provision the Windows dev node (dev-win context)."
run = "fnox exec --if-missing ignore -- nu scripts/cluster-up.nu --context dev-win"

[tasks."dev:win:deploy"]
description = "Deploy the dev-windows recipe (dockur + oem provisioning) onto the dev-win node."
run = "fnox exec --if-missing ignore -- nu scripts/recipe-deploy.nu dev-windows --context dev-win"

[tasks."dev:win:down"]
# Headless --yes too. NOTE: this destroys the Windows guest disk (no snapshot —
# unlike win:down). If you need to preserve guest state, use the win:* flow
# (win:snapshot/win:down) on a win-batch node instead of a dev-win node.
description = "Destroy the Windows dev node (auto-confirmed; guest state is NOT snapshotted)."
run = "fnox exec --if-missing ignore -- nu scripts/cluster-down.nu --context dev-win --yes"

# dev:secrets — wire the dev containers to OrangeVault (the running Bitwarden-compat
# vault). The vault URL defaults from $ORANGEVAULT_DEV_DOMAIN; only the dedicated
# dev/CI ACCOUNT creds need setting. See docs/DEVCONTAINERS.md "Secrets via OrangeVault".
[tasks."dev:secrets:set"]
description = "Auto-provision the dedicated dev/CI OrangeVault account via orangevault-cli (register + mint API key → keychain). Idempotent."
shell = "nu -c"
run = '''
let server = ($env.ORANGEVAULT_DEV_DOMAIN? | default "https://orangevault.gedw99.workers.dev")
print "Auto-provisioning the dedicated dev/CI OrangeVault account (NEVER your personal vault)."

# Email — the one human choice (which identity). No mail is sent; any unique
# address works. Prompt + store if not already in the keychain.
mut email = (do { ^fnox get ORANGEVAULT_DEV_EMAIL } | complete | if $in.exit_code == 0 { $in.stdout | str trim } else { "" })
if ($email | is-empty) {
  $email = (input "dev/CI account email: " | str trim)
  $email | ^fnox set --global -p keychain ORANGEVAULT_DEV_EMAIL
}

# Master password — generated + stored if missing (you never type it).
mut pw = (do { ^fnox get ORANGEVAULT_DEV_MASTER_PASSWORD } | complete | if $in.exit_code == 0 { $in.stdout | str trim } else { "" })
if ($pw | is-empty) {
  $pw = (^openssl rand -base64 24 | str trim)
  $pw | ^fnox set --global -p keychain ORANGEVAULT_DEV_MASTER_PASSWORD
  print "  ✓ generated ORANGEVAULT_DEV_MASTER_PASSWORD"
}

$env.OV_SERVER = $server
$env.OV_EMAIL = $email
$env.OV_MASTER_PASSWORD = $pw

# register is idempotent (an existing account just continues); then mint the key.
let reg = (do { ^orangevault-cli register --name "vm-uncloud dev/CI" } | complete)
if $reg.exit_code == 0 { print "  ✓ registered" } else { print "  • account already exists (continuing)" }

let out = (^orangevault-cli get-apikey | lines)
let cid = ($out | where {|l| $l | str starts-with "BW_CLIENTID=" } | first | str replace "BW_CLIENTID=" "")
let csec = ($out | where {|l| $l | str starts-with "BW_CLIENTSECRET=" } | first | str replace "BW_CLIENTSECRET=" "")
if ($cid | is-empty) or ($csec | is-empty) { print -e "✗ get-apikey returned no key"; exit 1 }
$cid | ^fnox set --global -p keychain ORANGEVAULT_DEV_BW_CLIENTID
$csec | ^fnox set --global -p keychain ORANGEVAULT_DEV_BW_CLIENTSECRET
print "  ✓ stored ORANGEVAULT_DEV_BW_CLIENTID + ORANGEVAULT_DEV_BW_CLIENTSECRET"
print "Next: mise run dev:secrets:check"
'''

[tasks."dev:secrets:check"]
description = "Doctor: verify OrangeVault is reachable, its DOMAIN is correct, and the dev/CI creds are set."
run = "nu scripts/dev-secrets-check.nu"

# registry — publish "what's live" into OrangeVault so other systems discover it by
# name (vmu/<context>/<service> with the URL in the `uri` field). recipe deploys
# auto-publish when VMU_REGISTRY=1 (set it in mise.local.toml once verified); these
# tasks exercise it manually first. See docs/REGISTRY.md.
[tasks."registry:list"]
description = "List live systems registered in OrangeVault (mise run registry:list [-- --context cluster])."
run = "nu scripts/registry.nu list"

[tasks."registry:publish"]
description = "Manually register a live URL: mise run registry:publish -- --context cluster --service moltis --url https://moltis.<domain>"
run = "nu scripts/registry.nu publish"

[tasks."registry:remove"]
description = "Remove a registered system: mise run registry:remove -- --context cluster --service moltis"
run = "nu scripts/registry.nu remove"

# ov-admin — thin ConnectRPC client for orangevault-admin (JSON over HTTP; no
# binary). Needs ORANGEVAULT_ADMIN_DOMAIN (+ _TOKEN for non-healthz). The admin
# worker's auth is WIP — verify-on-first-use. See docs/orangevault-admin.md.
[tasks."ov-admin:healthz"]
description = "Ping orangevault-admin (ConnectRPC Healthz)."
run = "nu scripts/ov-admin.nu healthz"

[tasks."ov-admin:list-users"]
description = "List users via orangevault-admin (needs ORANGEVAULT_ADMIN_TOKEN)."
run = "nu scripts/ov-admin.nu list-users"

# ── r2 (Cloudflare R2 — snapshot transit bucket for win-kvm) ────────────────
[tasks."r2:bootstrap"]
description = "Guided one-time R2 bucket + token setup for the win-kvm snapshot pipeline."
run = "nu r2/bootstrap.nu"

[tasks."r2:check"]
description = "Probe PUT/GET/DELETE against the configured R2 bucket (run after r2:bootstrap)."
run = "fnox exec --if-missing ignore -- nu r2/check.nu"

# ---------------------------------------------------------------------------
# gui — browser status board (nodes, services, snapshots, prices, deploy ledger),
# served by http-nu + Datastar, supervised by pitchfork alongside the xs event
# bus. Named gui:*/xs:* so they don't collide with the cluster's up/down.
#   mise run gui:up   → http://127.0.0.1:8080   ;   mise run gui:down
# ---------------------------------------------------------------------------
[tasks."gui:up"]
description = "Start the web GUI + xs event bus (pitchfork daemons). → http://127.0.0.1:8080"
run = "pitchfork start xs gui"
dir = "{{config_root}}"

[tasks."gui:down"]
description = "Stop the web GUI + xs daemons."
run = "pitchfork stop xs gui"
dir = "{{config_root}}"

[tasks."gui:serve"]
description = "Run the GUI in the foreground (interactive; --watch hot-reloads serve.nu). For background use gui:up."
run = "fnox exec --if-missing ignore -- http-nu --datastar --watch $HTTP_NU_ADDR gui/server/serve.nu"

[tasks."xs:serve"]
description = "Run the xs event store in the foreground. For background use gui:up."
run = "xs serve $XS_STORE --expose $XS_ADDR"
dir = "{{config_root}}"

[tasks."gui:logs"]
description = "Tail the GUI daemon log (--follow)."
run = "pitchfork logs gui --follow"

[tasks."gui:jobs"]
description = "Show what pitchfork is supervising (gui, xs)."
run = "pitchfork list"

# ---------------------------------------------------------------------------
# ai / mcp — the AI-facing surface (sibling to the human-facing GUI). Both read
# the same uncloud state via mcp/init.nu's wrappers.
# ---------------------------------------------------------------------------
[tasks."mcp:serve"]
description = "Nushell MCP server (stdio) — Claude Desktop/Code drives uncloud via mcp/init.nu wrappers."
run = "fnox exec --if-missing ignore -- nu --mcp --config mcp/init.nu"
dir = "{{config_root}}"

[tasks."ai:ask"]
description = "One LLM turn over the control plane. Usage: mise run ai:ask -- 'are any nodes running?'. Needs ANTHROPIC_API_KEY in keychain."
run = "fnox exec --if-missing ignore -- yoke --provider anthropic --model claude-sonnet-4-5 --tools nu --config mcp/init.nu"
dir = "{{config_root}}"

# ---------------------------------------------------------------------------
# Secrets — one-time keychain population. Run these once per machine.
#   mise run secrets:set   then paste each token.
# ---------------------------------------------------------------------------
[tasks."vultr:dashboard"]
description = "Open the Vultr API-keys dashboard page in your browser (to copy your key)"
run = "nu scripts/open.nu 'https://my.vultr.com/settings/#settingsapi'"

[tasks."vultr:onboard"]
description = "Onboard Vultr: opens the API dashboard, then sets + validates VULTR_API_KEY in the keychain (+ ssh/region picks)"
run = "nu scripts/vultr-onboard.nu"

[tasks."secrets:set"]
description = "Seed HCLOUD_TOKEN + CLOUDFLARE_API_TOKEN in the keychain (skip if already set)"
run = """
echo "These are shared keychain items (service: fnox). If 'fnox get' shows a value, you're done."
fnox get HCLOUD_TOKEN >/dev/null 2>&1         && echo "HCLOUD_TOKEN: already set"         || fnox set -p keychain HCLOUD_TOKEN
fnox get CLOUDFLARE_API_TOKEN >/dev/null 2>&1 && echo "CLOUDFLARE_API_TOKEN: already set" || fnox set -p keychain CLOUDFLARE_API_TOKEN
"""

# ── ARM (cax) capacity: check availability + secure boxes before they sell out ─
[tasks."arm:check"]
description = "Show Hetzner ARM (cax) availability (EU-only: nbg1/hel1/fsn1, often sold out; US/SIN offer no ARM)."
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu check"

[tasks."arm:list"]
description = "List the cax boxes we currently hold (arm-reserve-*) — name, type, DC, IP, status."
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu list"

[tasks."arm:grab"]
description = "Secure ONE cax box in a location (creates + keeps it → billing). Usage: mise run arm:grab -- <location> [size]"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu grab"

[tasks."arm:secure"]
description = "Secure one cax box in EVERY location that has stock right now (billing!). Usage: mise run arm:secure -- [size]"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu secure"

[tasks."arm:adopt"]
description = "Adopt a held cax box INTO the uncloud cluster (uncloud machine add). Usage: mise run arm:adopt -- <location> [--context X] [--ssh-key path]"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu adopt"

[tasks."arm:evict"]
description = "Remove a cax box from the cluster but KEEP the Hetzner server (re-adoptable). Usage: mise run arm:evict -- <location> [--context X]"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu evict"

[tasks."arm:watch"]
description = "Watch + auto-grab cax up to --max boxes (default 1), then idle. Usage: mise run arm:watch -- [size] [--max N] [--interval S]"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu watch"

# Supervised (pitchfork) variants so the watch survives sessions/crashes — same
# relationship as gui:up/down ↔ gui:serve. arm:watch:up auto-grabs cax11 (billing).
[tasks."arm:watch:up"]
description = "Start the supervised ARM watcher (pitchfork, 5s poll, auto-grabs cax11 → billing)."
run = "pitchfork start arm-watch"
dir = "{{config_root}}"

[tasks."arm:watch:down"]
description = "Stop the supervised ARM watcher."
run = "pitchfork stop arm-watch"
dir = "{{config_root}}"

[tasks."arm:release"]
description = "Delete a secured cax box. Usage: mise run arm:release -- <location>"
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu release"

[tasks."arm:release-all"]
description = "Delete ALL secured cax boxes (arm-reserve-*)."
run = "fnox exec --if-missing ignore -- nu scripts/arm.nu release-all"

