# tasks/dev.toml — the `uncloud:dev:*` "remote dev" namespace. INCLUDE this from a
# PROJECT repo to build/test that project on a vm-uncloud dev node (the
# recipes/dev-linux container). Your repo stays on your Mac; these tasks sync it
# to the node and run the project's OWN mise tasks there (build / docker /
# release) on a box that matches the deploy target. mise pulls ONLY this file,
# like cliff.toml — so it is self-contained and uses the flat task-file format
# (no [tools]/[env] here).
#
# Task names are namespaced with `uncloud:` so they CANNOT clash with a project's
# own `dev:*` (or other) tasks. The operator side (provisioning the node) lives in
# the vm-uncloud repo as plain `dev:*` tasks — those aren't included anywhere.
#
# 1) Bring the node up once (in the vm-uncloud repo):
#      mise run dev:up && mise run dev:deploy && mise run dev:ssh:wait
#      mise run dev:ip            # note the node IP, or use dev.<domain>
#
# 2) In the PROJECT's mise.toml:
#      [task_config]
#      includes = ["git::https://github.com/joeblew999/vm-uncloud.git//tasks/dev.toml?ref=<tag-or-branch>"]
#
#    For the portable `uncloud:dev:container` path also add the Dev Containers CLI:
#      [tools]
#      "devcontainer-cli" = "latest"
#
# 3) Point it at the node, per developer (project's mise.local.toml, NOT committed):
#      [env]
#      DEV_HOST = "dev.amplifycms.com"     # or the node IP from `mise run dev:ip`
#      # optional: DEV_PORT (2222), DEV_USER (vscode), DEV_REMOTE_ROOT (/workspace),
#      #           DEV_PROJECT (defaults to the repo dir name), DEV_SSH_KEY (~/.ssh/...)
#
# 4) The loop:
#      mise run uncloud:dev:sync             # push the repo to the node
#      mise run uncloud:dev:exec -- build    # run THIS project's `mise run build` on the node
#      mise run uncloud:dev:build            # sync + build in one shot
#      mise run uncloud:dev:release          # sync + run the project's `release` task remotely
#      mise run uncloud:dev:code             # open VS Code Remote-SSH at the synced repo
#      mise run uncloud:dev:shell            # interactive shell on the node, in the repo
#      mise run uncloud:dev:container        # (portable) `devcontainer up` against the node's Docker

["uncloud:dev:sync"]
description = "rsync the project to the dev node (honors .gitignore; keeps .git for release)."
run = '''
set -eu
: "${DEV_HOST:?set DEV_HOST in mise.local.toml — the dev node, e.g. dev.<domain> or its IP (mise run dev:ip)}"
PORT="${DEV_PORT:-2222}"; RUSER="${DEV_USER:-vscode}"; ROOT="${DEV_REMOTE_ROOT:-/workspace}"; PROJ="${DEV_PROJECT:-$(basename "$PWD")}"
SSH="ssh -p $PORT -o StrictHostKeyChecking=accept-new ${DEV_SSH_KEY:+-i $DEV_SSH_KEY}"
echo "==> rsync ./ -> $RUSER@$DEV_HOST:$ROOT/$PROJ/"
$SSH "$RUSER@$DEV_HOST" "mkdir -p '$ROOT/$PROJ'"
rsync -az --delete --filter=':- .gitignore' --exclude '.git/index.lock' \
  -e "$SSH" ./ "$RUSER@$DEV_HOST:$ROOT/$PROJ/"
'''

["uncloud:dev:exec"]
description = "Run a project mise task ON the dev node: mise run uncloud:dev:exec -- build"
usage = 'arg "<task>" var=#true'
# If the project ships a fnox.toml, the remote task runs under `fnox exec` so its
# secrets resolve (from OrangeVault via the dev container's unlocked session — see
# docs/DEVCONTAINERS.md "Secrets"). Otherwise it runs plain.
run = '''
set -eu
: "${DEV_HOST:?set DEV_HOST in mise.local.toml (the dev node)}"
PORT="${DEV_PORT:-2222}"; RUSER="${DEV_USER:-vscode}"; ROOT="${DEV_REMOTE_ROOT:-/workspace}"; PROJ="${DEV_PROJECT:-$(basename "$PWD")}"
echo "==> $RUSER@$DEV_HOST: (cd $ROOT/$PROJ && [fnox exec] mise run $usage_task)"
ssh -p "$PORT" -o StrictHostKeyChecking=accept-new ${DEV_SSH_KEY:+-i "$DEV_SSH_KEY"} \
  "$RUSER@$DEV_HOST" "cd '$ROOT/$PROJ' && if [ -f fnox.toml ] && command -v fnox >/dev/null 2>&1; then fnox exec -- mise run $usage_task; else mise run $usage_task; fi"
'''

["uncloud:dev:build"]
description = "Sync, then run the project's `build` task on the dev node."
run = "mise run uncloud:dev:sync && mise run uncloud:dev:exec -- build"

["uncloud:dev:test"]
description = "Sync, then run the project's `test` task on the dev node."
run = "mise run uncloud:dev:sync && mise run uncloud:dev:exec -- test"

["uncloud:dev:release"]
description = "Sync, then run the project's `release` task on the dev node (build + docker + GitHub release)."
run = "mise run uncloud:dev:sync && mise run uncloud:dev:exec -- release"

["uncloud:dev:shell"]
description = "Open an interactive shell on the dev node, in the synced repo."
run = '''
set -eu
: "${DEV_HOST:?set DEV_HOST in mise.local.toml (the dev node)}"
PORT="${DEV_PORT:-2222}"; RUSER="${DEV_USER:-vscode}"; ROOT="${DEV_REMOTE_ROOT:-/workspace}"; PROJ="${DEV_PROJECT:-$(basename "$PWD")}"
exec ssh -t -p "$PORT" -o StrictHostKeyChecking=accept-new ${DEV_SSH_KEY:+-i "$DEV_SSH_KEY"} \
  "$RUSER@$DEV_HOST" "cd '$ROOT/$PROJ' 2>/dev/null; exec bash -l"
'''

["uncloud:dev:code"]
description = "Open VS Code Remote-SSH at the synced repo (writes a managed ~/.ssh/config alias)."
run = '''
set -eu
: "${DEV_HOST:?set DEV_HOST in mise.local.toml (the dev node)}"
PORT="${DEV_PORT:-2222}"; RUSER="${DEV_USER:-vscode}"; ROOT="${DEV_REMOTE_ROOT:-/workspace}"; PROJ="${DEV_PROJECT:-$(basename "$PWD")}"
ALIAS="${DEV_SSH_ALIAS:-vmu-dev-$PROJ}"
mkdir -p ~/.ssh
if ! grep -qE "^Host[[:space:]]+$ALIAS$" ~/.ssh/config 2>/dev/null; then
  {
    echo ""
    echo "Host $ALIAS"
    echo "  HostName $DEV_HOST"
    echo "  User $RUSER"
    echo "  Port $PORT"
    [ -n "${DEV_SSH_KEY:-}" ] && echo "  IdentityFile $DEV_SSH_KEY"
    echo "  StrictHostKeyChecking accept-new"
  } >> ~/.ssh/config
  echo "==> added ~/.ssh/config Host '$ALIAS' -> $RUSER@$DEV_HOST:$PORT"
fi
if command -v code >/dev/null 2>&1; then
  code --new-window --remote "ssh-remote+$ALIAS" "$ROOT/$PROJ"
else
  echo "VS Code 'code' CLI not found. Open manually:"
  echo "  code --remote ssh-remote+$ALIAS $ROOT/$PROJ"
fi
'''

["uncloud:dev:container"]
description = "PORTABLE path: `devcontainer up` against the node's Docker (uses .devcontainer/)."
run = '''
set -eu
: "${DEV_HOST:?set DEV_HOST in mise.local.toml (the dev node)}"
command -v devcontainer >/dev/null 2>&1 || { echo "devcontainer CLI missing — add to the project [tools]: \"devcontainer-cli\" = \"latest\""; exit 1; }
# Point the Dev Containers CLI at the node's Docker daemon over SSH. This builds
# the container directly via the node's Docker (outside uncloud's deploy/lifecycle
# — the recipe path, uncloud:dev:build, is the idiomatic one; this is the portable
# escape hatch when you want a literal Reopen-in-Container against the remote).
export DOCKER_HOST="${DEV_DOCKER_HOST:-ssh://root@$DEV_HOST}"
echo "==> DOCKER_HOST=$DOCKER_HOST  devcontainer up --workspace-folder ."
devcontainer up --workspace-folder .
echo "then: DOCKER_HOST=$DOCKER_HOST devcontainer exec --workspace-folder . mise run build"
'''
