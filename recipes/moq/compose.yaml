# moq-relay — Media over QUIC relay (moq.dev). Forwards live media subscriptions
# from publishers to subscribers over QUIC/WebTransport, caching + deduplicating.
#
#   mise run recipe moq            # on the cluster
#
# ── SCAFFOLD — NOT yet deploy-verified ────────────────────────────────────────
# This is the starting point for the moq recipe. It runs the official prebuilt
# image (no fork, no build) but several things MUST be verified/hardened on the
# first real deploy — see recipes/moq/README.md. Known open items:
#   1. UDP ingress + firewall. moq's primary transport is QUIC over UDP:4443. The
#      cluster firewall opens only 22/80/443/51820 — a UDP:4443 (and TCP:4443)
#      rule is required (like the windows RDP :3389 rule). Raw ports below, NOT
#      Caddy-fronted (QUIC is not HTTP, so the wildcard-cert Caddy ingress can't
#      proxy it).
#   2. TLS. Scaffold uses moq-relay's self-signed cert (tls.generate); browsers
#      then need the certificate.sha256 fingerprint (served on the TCP port).
#      Production wants a real cert for moq.<domain>.
#   3. Auth. Scaffold is ANONYMOUS (`[auth] public = ""`). Production wants token
#      auth via moqdev/moq-token-cli.
#
# Image is multi-arch (amd64 + arm64) — runs on cax ARM nodes too. Tag pinned.
services:
  moq-relay:
    image: moqdev/moq-relay:0.12.13
    # moq-relay takes ONE arg: the path to a TOML config file, and uncloud can't
    # bind-mount host files — so write the config (generated by prepare.nu and
    # injected via MOQ_RELAY_CONFIG) to a tmp file at start, then exec the relay.
    # The image's /bin/moq-relay is the entrypoint target; we override to a shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'printf "%s" "$$MOQ_RELAY_CONFIG" > /tmp/relay.toml && exec /bin/moq-relay /tmp/relay.toml'
    environment:
      MOQ_RELAY_CONFIG: ${MOQ_RELAY_CONFIG}
      RUST_LOG: info
    x-ports:
      # QUIC / WebTransport (primary). Raw UDP — needs a node firewall rule.
      - 4443:4443/udp@host
      # HTTP + WebSocket fallback + certificate.sha256 (for the self-signed cert).
      - 4443:4443/tcp@host
    restart: always
