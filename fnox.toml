# fnox secrets contract for vm-uncloud.
#
# Secret VALUES live in the macOS keychain (service: "fnox"); this file is just
# the pointer table mapping env-var names → keychain item names. Safe to commit.
# `fnox exec -- <cmd>` (wrapped by the mise tasks) injects them at run time.
#
# These names match the existing keychain items shared across repos (see
# joeblew999/vm-servers) — they ARE the cross-repo contract, do not rename:
#   - HCLOUD_TOKEN          : read natively by `hcloud` AND the tofu hcloud provider
#   - CLOUDFLARE_API_TOKEN  : read natively by the tofu cloudflare provider
# So no TF_VAR_* indirection is needed — the providers pick these up from env.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
HCLOUD_TOKEN         = { provider = "keychain", value = "HCLOUD_TOKEN" }
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }

# Remote tofu state in R2 (used by `mise run state:remote`). The S3 backend +
# aws read AWS_*; R2_ACCOUNT_ID builds the endpoint. Point these at a valid R2
# S3 token (Access Key ID = 32 chars, Secret = 64 chars).
AWS_ACCESS_KEY_ID     = { provider = "keychain", value = "IRONMIND_R2_ACCESS_KEY_ID" }
AWS_SECRET_ACCESS_KEY = { provider = "keychain", value = "IRONMIND_R2_SECRET_ACCESS_KEY" }
R2_ACCOUNT_ID         = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
