# fnox secrets contract for vm-uncloud.
#
# Secret VALUES live in the macOS keychain (service: "fnox"); this file is just
# the pointer table mapping env-var names → keychain item names. Safe to commit.
# `fnox exec -- <cmd>` (wrapped by the mise tasks) injects them at run time.
#
# These names match the existing keychain items shared across repos (see
# joeblew999/vm-servers) — they ARE the cross-repo contract, do not rename:
#   - HCLOUD_TOKEN          : read natively by `hcloud` AND the tofu hcloud provider
#   - CLOUDFLARE_API_TOKEN  : read natively by the tofu cloudflare provider; also
#                             derives the R2 S3 creds for remote state (scripts/r2.nu)
# The providers read these straight from the environment — no extra wiring.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
HCLOUD_TOKEN          = { provider = "keychain", value = "HCLOUD_TOKEN" }
CLOUDFLARE_API_TOKEN  = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }
# Used to build the R2 endpoint and to derive R2 S3 creds from the CF token
# (token id = access key, sha256(token) = secret). No separate R2 token needed.
CLOUDFLARE_ACCOUNT_ID = { provider = "keychain", value = "CLOUDFLARE_ACCOUNT_ID" }
# win-kvm only — read natively by `vultr-cli` for Vultr Bare Metal provisioning.
# Optional: absent until you run win-kvm; scripts use `fnox exec --if-missing ignore`.
VULTR_API_KEY         = { provider = "keychain", value = "VULTR_API_KEY" }
# ai:ask only — Anthropic key for the yoke LLM driver. Optional (if-missing ignore).
ANTHROPIC_API_KEY     = { provider = "keychain", value = "ANTHROPIC_API_KEY" }
# win-kvm R2 snapshot transit only. aws-cli reads AWS_* natively, so expose the
# same R2 keychain items under both names (matches vm-servers). Optional.
R2_ACCESS_KEY_ID      = { provider = "keychain", value = "R2_ACCESS_KEY_ID" }
R2_SECRET_ACCESS_KEY  = { provider = "keychain", value = "R2_SECRET_ACCESS_KEY" }
AWS_ACCESS_KEY_ID     = { provider = "keychain", value = "R2_ACCESS_KEY_ID" }
AWS_SECRET_ACCESS_KEY = { provider = "keychain", value = "R2_SECRET_ACCESS_KEY" }
