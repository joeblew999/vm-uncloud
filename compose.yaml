# Default example: a public image on your domain. Any subdomain under your
# domain works out of the box — the wildcard *.<domain> record + wildcard cert
# (issued at cluster bring-up) already cover it. Just change the hostname.
#
#   mise run deploy        # deploys this
#
# To ship your OWN app, give the service a `build:` section instead of `image:`
# and `mise run deploy` builds locally + pushes only changed layers + rolls out.
services:
  whoami:
    image: traefik/whoami:latest
    x-ports:
      - app.amplifycms.net:80/https
