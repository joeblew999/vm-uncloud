#cloud-config
# Minimal first-boot prep. We deliberately do NOT install uncloud here — that's
# `uc machine init`'s job (single installer, no double-install, no half-started
# daemon). cloud-init just makes sure curl/ca-certificates are present (the
# uncloud installer fetched over SSH needs them) and provides a clean
# `cloud-init status --wait` signal for tofu's readiness provisioner.
package_update: true
package_upgrade: false
packages:
  - curl
  - ca-certificates
