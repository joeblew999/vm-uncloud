# pitchfork daemons for the vm-uncloud web control plane.
#   xs  — event bus (future: live deploy events).
#   gui — http-nu serving the status board on $HTTP_NU_ADDR.
# Daily UX: `mise run gui:up` / `mise run gui:down` (= pitchfork start/stop).
# Each delegates to a mise task so it picks up [env] + {{config_root}}.

[daemons.xs]
run = "mise run xs:serve"
retry = 5

[daemons.gui]
run = "mise run gui:serve"
retry = 5

# arm-watch — poll Hetzner every 5s and AUTO-GRAB cax (ARM) the moment any EU site
# restocks (→ billing per grab). Hard cap: `--max 3` = one box in EACH of the 3 EU
# sites (nbg1/hel1/fsn1, the only places ARM exists), then idles. Held boxes live
# in Hetzner (the SSOT) — see `mise run arm:list`; no local record. Supervised so
# it stays alive across sessions/crashes. Start/stop: `arm:watch:up`/`arm:watch:down`.
[daemons.arm-watch]
run = "mise run arm:watch -- cax11 --max 3"
retry = 10
