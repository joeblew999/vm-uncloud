name: check
# Thin stub — the shared reusable workflow runs `mise run ci` (this repo's OpenTofu
# fmt/validate + nushell parse), the SAME task you run locally. checkout/mise/cache
# are owned by joeblew999/.github so they never drift. ubuntu-only: infra checks
# don't need the mac/windows matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@v0.69.0
    with:
      task: ci
      os-matrix: '["ubuntu-latest"]'
      rust-cache: false
