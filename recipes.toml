# Recipe sources — git repos that contain <name>/compose.yaml folders.
# `mise run recipe:deploy <name>` clones each into .src/<name> and searches them in
# order, deploying the first match. Add your own repos here — that's the whole
# "how to add more" story.

[[sources]]
name = "uncloud-recipes"
url = "https://github.com/psviderski/uncloud-recipes"

